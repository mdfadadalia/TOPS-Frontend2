<!DOCTYPE html>
<html>

<head>
    <style>
        .text {
            font-size: 80px;
            transition: font-size 2s ease;
        }
        .text.small {
            font-size: 30px;
        }
    </style>
</head>

<body>
    <h1 class="text" id="txt">Hello World</h1>
    <button onclick="shrink()">Shrink Text</button>
    <h1 id="text2" class="text">Hello Mayur</h1>    
    <script>
        function shrink() {
            document.getElementById("txt").classList.toggle("small");
        }
        var btn = document.getElementById("text2");
        btn.addEventListener("mouseover",()=> {
            document.getElementById("text2").style = 'color:blue; font-size:20px;transition:2s ease all'
        });
    </script>
    
</body>
</html>
