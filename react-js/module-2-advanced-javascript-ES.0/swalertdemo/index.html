<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sweetalert2.css">
    <script src="sweetalert2.all.min.js"></script>
</head>
<script>
    function test(x) {
        switch (x) {
            case 1:
                Swal.fire({
                    title: "The Internet?",
                    text: "That thing is still around?",
                    icon: "question"
                });
                break;
            case 2:
                Swal.fire({
                    title: "The Internet?",
                    text: "That thing is still around?",
                    icon: "info"
                });
                break;
            case 3:
                Swal.fire({
                    title: "The Internet?",
                    text: "That thing is still around?",
                    icon: "warning"
                });
                break;
            case 4:
                Swal.fire({
                    title: "The Internet?",
                    text: "That thing is still around?",
                    icon: "error"
                });
                break;
            case 5:
                Swal.fire({
                    title: "The Internet?",
                    text: "That thing is still around?",
                    icon: "success"
                });
                break;
            case 6:
                Swal.fire({
                    title: "Do you want to Continue ?",
                    showDenyButton: true,
                    //showCancelButton: true,
                    confirmButtonText: "Yes",
                    denyButtonText: `No`
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire("Yes Msg", "", "success");
                    } else if (result.isDenied) {
                        Swal.fire("No Msg", "", "info");
                    }
                });
                break;
            case 7:
                Swal.fire({
                    position: "top-end",
                    icon: "success",
                    title: "Your work has been saved",
                    showConfirmButton: false,
                    timer: 1500
                });
                break;
            case 8:
                Swal.fire({
                    title: "Are you sure?",
                    text: "You won't be able to revert this!",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "Yes, delete it!"
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({
                            title: "Deleted!",
                            text: "Your file has been deleted.",
                            icon: "success"
                        });
                    }
                });
                break;
            case 9:
                Swal.fire({
                    title: "Submit your Github username",
                    input: "text",
                    inputAttributes: {
                        autocapitalize: "off"
                    },
                    showCancelButton: true,
                    confirmButtonText: "Look up",
                    showLoaderOnConfirm: true,
                    preConfirm: async (login) => {
                        try {
                            const githubUrl = `https://api.github.com/users/${login} `;
                            const response = await fetch(githubUrl);
                            if (!response.ok) {
                                return Swal.showValidationMessage(`${JSON.stringify(await response.json())}`);
                            }
                            return response.json();
                        } 
                        catch (error) 
                        {
                            Swal.showValidationMessage(`Request failed: ${error}`);
                        }
                    },
                    allowOutsideClick: () => !Swal.isLoading()
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({
                            title: `${result.value.login}'s avatar`,
                            imageUrl: result.value.avatar_url
                        });
                    }
                });
                break;
        }
    }
</script>
<style>
    .button button{
        height: 100px; width: 200px; padding: 5px; margin: 15px; margin-top: 50px;
        font-size: medium;
        background: lightgray;        
    }
</style>
<body>
    <h1 align="center">Click to Show Sweet Alerts Demo</h1>
    <div class="button">
        <button onclick="test(1);">Question</button>
        <button onclick="test(2);">Info</button>
        <button onclick="test(3);">Warning</button>
        <button onclick="test(5);">Sucess</button>
        <button onclick="test(6);">Yes, NO</button>
        <button onclick="test(7);">Msg Hilight</button>
        <button onclick="test(8);">Want to Del ? </button>
        <button onclick="test(9);">Ajax Request- Response </button>
    </div>
</body>

</html>
