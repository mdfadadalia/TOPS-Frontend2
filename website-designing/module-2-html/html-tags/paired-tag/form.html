<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form Demo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">        
    </head>
    <body bgcolor="coral">
        <fieldset style="width: fit-content;">
            <legend align="right"><strong>Student Data</strong></legend>            
            <form action="#" id="form_test" >   <!-- novalidate -->                         
                <fieldset align='right'>                    
                    <label for="name">Name : </label>
                    <input type="text" name="name" id="name" placeholder="Enter Name" required>
                </fieldset>
                <fieldset align='right'>            
                    <label for="rno">Roll No. : </label>
                    <input type="text" name="rno" id="rno" placeholder="Enter Roll No." required>
                </fieldset>
                <fieldset align='right'>            
                    <label for="ct">City : </label>
                    <input type="text" name="ct" id="ct" placeholder="Enter City" required>
                </fieldset>
                <fieldset align='right'>            
                    <label for="eml">Email : </label>
                    <input type="email" name="eml" id="eml" placeholder="Enter Email" required>
                </fieldset>
                <fieldset align='center'>                                
                    <input type="submit" value="OK">
                </fieldset>
            </form>
        </fieldset> 
            <br><br><br>

        <fieldset style="width: fit-content;" form="form_test">
            <legend><strong>Student Extra Data</strong></legend>            
                
                    <label for="addr">Address : </label>
                    <input type="text" name="addr" id="addr" placeholder="Enter Address" required>
                
                    <label for="phone">Mo.No. : </label>
                    <input type="phone" name="phone" id="phone" placeholder="Enter Mo. No." required>
                
        </fieldset>                
    </body>
</html>
