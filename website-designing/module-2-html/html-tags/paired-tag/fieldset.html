<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
       <form action="#" id="form_test"></form>

<fieldset style="width: fit-content;" form="form_test">
    <legend><strong>Student Data</strong></legend>            

    <label for="name">Name : </label>
    <input form="form_test" type="text" name="name" id="name" ><br><br>

    <label for="rno">Roll No. : </label>
    <input form="form_test" type="text" name="rno" id="rno" ><br><br>

    <label for="ct">City : </label>
    <input form="form_test" type="text" name="ct" id="ct" ><br><br>

    <label for="eml">Email : </label>
    <input form="form_test" type="email" name="eml" id="eml" ><br><br>
</fieldset>

<fieldset style="width: fit-content;" form="form_test">
    <legend><strong>Student Extra Data</strong></legend>            

    <label for="addr">Address : </label>
    <input type="text" name="addr" id="addr" form="form_test" required><br><br>

    <label for="phone">Mo.No. : </label>
    <input type="phone" name="phone" id="phone" form="form_test" required><br><br>
</fieldset>

<input type="submit" form="form_test" value="Click OK">


    </body>
</html>
